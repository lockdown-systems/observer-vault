name: Release for Linux

on:
  push:
    tags:
      - "v*"

jobs:
  build-x86_64:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make sure the version string matches the tag
        run: |
          OV_VERSION=$(cat package.json | grep '"version"' | head -1 | cut -d'"' -f4)
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG_VERSION#v} # strip the leading 'v' from the tag
          if [ "$OV_VERSION" != "$TAG_VERSION" ]; then
            echo "::error file=package.json,title=Version check failed::Version string in package.json $OV_VERSION does not match the tag $TAG_VERSION"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Linux release (reproducible)
        run: ./scripts/release-linux.sh --reproducible

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages-x86_64
          path: release/*.deb

  build-arm64:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make sure the version string matches the tag
        run: |
          OV_VERSION=$(cat package.json | grep '"version"' | head -1 | cut -d'"' -f4)
          TAG_VERSION=${GITHUB_REF#refs/tags/}
          TAG_VERSION=${TAG_VERSION#v} # strip the leading 'v' from the tag
          if [ "$OV_VERSION" != "$TAG_VERSION" ]; then
            echo "::error file=package.json,title=Version check failed::Version string in package.json $OV_VERSION does not match the tag $TAG_VERSION"
            exit 1
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install pnpm
        run: npm install -g pnpm@10.18.1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git python3

      - name: Build Linux release
        run: ./scripts/release-linux.sh

      - name: Upload DEB artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deb-packages-arm64
          path: release/*.deb
